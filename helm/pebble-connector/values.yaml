image:
  repository: ghcr.io/hey-pebble/pebble-connector
  tag: ""  # Defaults to chart appVersion
  pullPolicy: IfNotPresent

pebble:
  apiUrl: "https://pebble.venturecatalyst.ai"
  # API key - set via --set or reference an existing secret
  connectorApiKey: ""
  existingSecret: ""  # Name of existing K8s secret with 'connector-api-key' key

gcp:
  projectId: ""
  region: ""
  instanceName: ""
  iapClientId: ""  # Required: OAuth client ID for IAP-protected backend
  identityPlatformApiKey: ""  # Identity Platform Web API key (required when GCIP enabled on IAP)

database:
  name: ""
  iamUser: ""

connector:
  workers: 5
  pollInterval: 5
  ipType: "PRIVATE"

serviceAccount:
  create: true
  name: ""
  annotations: {}
  # For GKE Workload Identity:
  #   iam.gke.io/gcp-service-account: pebble-sa@your-project.iam.gserviceaccount.com

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi

# Pod-level securityContext. Applied to the whole pod.
# UID/GID 10001 must match the `pebble` user pinned in the Dockerfile.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001

# Container-level securityContext for the connector container.
# An explicit numeric runAsUser is set (rather than relying on the image's
# USER directive) so runAsNonRoot is verifiable by admission controllers
# (Pod Security Standards "restricted") and survives image rebuilds that
# might otherwise shift the UID.
securityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  capabilities:
    drop:
      - ALL

replicaCount: 1

networkPolicy:
  # Requires GKE Dataplane V2 (default on Autopilot; must be explicitly enabled on Standard).
  # Uses the alpha FQDNNetworkPolicy API — may change on GKE version upgrades.
  # pebble.apiUrl must include a scheme (e.g. https://...) when enabled.
  enabled: false
  # Additional FQDNs the connector is allowed to reach on port 443.
  # The backend API hostname is auto-derived from pebble.apiUrl — no need to duplicate it here.
  allowedFQDNs: []
  # Cloud SQL CIDR — REQUIRED when networkPolicy is enabled.
  # Set to the actual Cloud SQL private IP or subnet (e.g. "10.50.0.2/32").
  cloudSqlCidr: ""
