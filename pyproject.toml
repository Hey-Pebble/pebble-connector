[tool.poetry]
name = "pebble-connector"
version = "0.1.0"
description = "Pebble Database Connector - polls for and executes database query jobs"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
aiohttp = "^3.14.3"
asyncpg = "^0.29"
"cloud-sql-python-connector" = {version = "^1.12", extras = ["asyncpg"]}
cryptography = "^50.0.0"
google-auth = "^2.27"
pyasn1 = "^0.6.4"
requests = "^2.33.1"
# Security floors (SEC-31) — transitive deps pinned to ensure CVE-fixed versions
idna = ">=3.15"
urllib3 = ">=2.7.0"

[tool.poetry.scripts]
pebble-connector = "src.main:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

